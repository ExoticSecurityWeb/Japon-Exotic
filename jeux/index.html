<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeux — Exotic Security Japon</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#161221;
    --night-deep:#0c0a13;
    --sakura:#f7b8c8;
    --sakura-soft:#fbd8e1;
    --gold:#d9b872;
    --paper:#f3ece6;
    --paper-dim:#c9c0d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:radial-gradient(ellipse at 50% -10%, #241d33 0%, var(--night) 45%, var(--night-deep) 100%);
    min-height:100vh;
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--paper);
  }

  nav{
    max-width:820px; margin:0 auto;
    padding:28px 24px 0;
    display:flex; justify-content:space-between; align-items:center;
  }
  nav a{
    color:var(--gold); text-decoration:none; font-size:0.8rem;
    letter-spacing:0.15em; text-transform:uppercase;
    border:1px solid rgba(217,184,114,0.4);
    padding:8px 16px; border-radius:3px;
  }

  main{
    max-width:820px; margin:0 auto;
    padding:6vh 24px 8vh;
    text-align:center;
  }

  .eyebrow{
    font-weight:300; letter-spacing:0.35em; text-transform:uppercase;
    font-size:0.72rem; color:var(--gold); margin:0 0 20px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:clamp(2.4rem, 8vw, 3.6rem);
    margin:0 0 44px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:18px;
  }

  .game-card{
    display:block;
    text-decoration:none;
    background:rgba(22,18,33,0.6);
    border:1px solid rgba(217,184,114,0.3);
    border-radius:10px;
    padding:28px 20px;
    transition:transform 0.15s, border-color 0.15s;
    text-align:left;
  }
  .game-card:hover{
    transform:translateY(-3px);
    border-color:var(--sakura);
  }
  .game-card .icon{
    font-size:2.4rem;
    display:block;
    margin-bottom:12px;
  }
  .game-card h2{
    font-family:'Shippori Mincho', serif;
    font-size:1.15rem;
    color:var(--paper);
    margin:0 0 6px;
    font-weight:500;
  }
  .game-card p{
    font-size:0.82rem;
    color:var(--paper-dim);
    margin:0;
    line-height:1.5;
  }

  .game-card.soon{
    opacity:0.45;
    cursor:default;
    pointer-events:none;
  }
  .game-card.soon h2::after{
    content:" — bientôt";
    font-size:0.7rem;
    color:var(--sakura-soft);
  }

  footer{
    text-align:center;
    padding:0 24px 6vh;
    font-size:0.75rem;
    letter-spacing:0.1em;
    color:var(--paper-dim);
    opacity:0.7;
  }
</style>
</head>
<body>

  <nav>
    <a href="/">← Accueil</a>
    <a href="/">Exotic Security</a>
  </nav>

  <main>
    <p class="eyebrow">Exotic Games</p>
    <h1>Jeux</h1>

    <div class="grid">
      <a href="/jeu/gatcha" class="game-card">
        <span class="icon">🎴</span>
        <h2>Gatcha</h2>
        <p>Tire des objets à collectionner, gère tes pièces, construis ta collection. Compte lié.</p>
      </a>

      <a href="/jeu/riichi" class="game-card">
        <span class="icon">🀄</span>
        <h2>Riichi Mahjong</h2>
        <p>Le vrai Mahjong japonais — règles, appels, yaku. Compte lié.</p>
      </a>
    </div>
  </main>

  <footer>© ExoticSecurity Japon</footer>

</body>
</html>
